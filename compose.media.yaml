# Media amd64 host. MCP is private; setup REST API binds only to host loopback.
name: monarch-mcp
services:
  monarch-mcp:
    build: .
    image: monarch-mcp-server:${MONARCH_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
      MCP_PATH: /
      SESSION_STORE_PATH: /data/monarch-session
      READ_ONLY: "true"
      ADMIN_API_KEY_FILE: /run/secrets/monarch_admin_key
      ADMIN_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8001:8001"
    secrets:
      - monarch_admin_key
    volumes:
      - monarch-session:/data
    networks: [monarch-private]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  tunnel-client:
    profiles: [tunnel]
    build:
      context: .
      dockerfile: deploy/Dockerfile.tunnel
    image: openai-tunnel-client:v0.0.14-local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.tunnel
        required: false
    environment:
      MCP_SERVER_URL: http://monarch-mcp:8000/
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    depends_on:
      monarch-mcp:
        condition: service_healthy
    networks: [monarch-private]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  monarch-private:
    # Egress is needed for Monarch and OpenAI; no other stacks join this network.
    driver: bridge
volumes:
  monarch-session:

secrets:
  monarch_admin_key:
    file: .admin-api-key
